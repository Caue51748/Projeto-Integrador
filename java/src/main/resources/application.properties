spring.application.name=backend

# Inicialização rápida no Render
spring.main.lazy-initialization=true

# Banco de dados e Pool HikariCP
spring.datasource.url=jdbc:mysql://143.106.241.3:3306/cl203108
spring.datasource.username=cl203108
spring.datasource.password=cl*29082007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate otimizado para inicialização remota
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Servidor e Compressão GZIP
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Limite de tamanho de upload (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB