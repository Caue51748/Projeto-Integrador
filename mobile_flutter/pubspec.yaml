name: SocialJoin
description: A melhor rede social para eventos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - ../.pub/icons/
    - assets/images/
    - slaq.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../.pub/icons/logofb.png"